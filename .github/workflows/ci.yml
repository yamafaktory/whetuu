name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0-dev.1811+6716bf52e
  RUFF_VERSION: 0.16.3

jobs:
  test:
    name: Format, check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check src build.zig
      - run: zig build check
      - run: zig build test

  lint:
    name: Lint the tools and the shell integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: format --check
      # shellcheck reads sh and bash. zsh and fish are parsed by their own
      # shells instead, which is all either one offers.
      - run: shellcheck tools/*.sh docs/install.sh assets/init.bash
      - run: ./tools/test-init.sh
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Parse every shell integration
        run: |
          bash -n assets/init.bash
          zsh -n assets/init.zsh
          fish --no-execute assets/init.fish

  cross-compile:
    # Guards against reintroducing a Linux-only syscall (std.os.linux.*) that
    # compiles natively but breaks the macOS builds.
    name: Cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build release
